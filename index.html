function svgEndorsementTree(g) {
  const W = 460, H = 240, P = 16;
  const eids = g.race.endorsers;
  const won = eids.filter(eid => g.player.endorsers[eid] && g.player.endorsers[eid].won);
  const inProgress = eids.filter(eid => g.player.endorsers[eid] && !g.player.endorsers[eid].won && g.player.endorsers[eid].progress > 0);
  const eligible = eids.filter(eid => !g.player.endorsers[eid] || g.player.endorsers[eid].progress === 0);
  const cols = [
    { label: "WON", items: won, color: "var(--good)" },
    { label: "IN PROGRESS", items: inProgress, color: "var(--accent)" },
    { label: "OPEN", items: eligible, color: "var(--muted)" },

  const cw = (W - 2*P) / 3;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--panel2);border-radius:6px">
    ${cols.map((col, i) => {
      const x = P + cw*i;
      return `<g><text x="${x+cw/2}" y="20" text-anchor="middle" fill="${col.color}" font-size="11" font-weight="bold">${col.label} (${col.items.length})</text>
      ${col.items.slice(0, 8).map((eid, j) => {

      }).join("")}</g>`;
    }).join("")}

}

function svgCalendarHeatmap(g) {
  const W = 720, H = 90, P = 12;
  const cellW = (W - 2*P) / 52;
  const log = g.log || [];
  const counts = new Array(52).fill(0);
  log.forEach(e => { if (e.week >= 1 && e.week <= 52) counts[e.week-1]++; });
  const max = Math.max(1, ...counts);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--panel2);border-radius:6px">
    ${counts.map((c, i) => {
      const intensity = c / max;
      const x = P + cellW*i;
      const cur = i+1 === g.week;
      return `<rect x="${x+1}" y="${20}" width="${cellW-2}" height="${H-40}" fill="var(--accent)" fill-opacity="${intensity*0.85}" stroke="${cur ? 'var(--accent)' : 'transparent'}" stroke-width="${cur ? 2 : 0}"><title>Week ${i+1} - ${weekToDateStr(i+1)} - ${c} events</title></rect>`;
    }).join("")}
    <text x="${P}" y="14" fill="var(--muted)" font-size="10">Wk 1 (Nov 3, 2025)</text>
    <text x="${W-P-90}" y="14" fill="var(--muted)" font-size="10">Wk 52 (Nov 2, 2026)</text>
    <text x="${P}" y="${H-6}" fill="var(--muted)" font-size="10">activity intensity by week · gold border = current week</text>
  </svg>`;
}

// ===== HELPERS for new tabs =====
function computeBurnRate(g) {
  const monthlySalaries = Object.values(g.player.staff || {}).reduce((s, st) => s + st.salary, 0);
  const weeklyBurn = monthlySalaries / 4;
  const runwayWeeks = weeklyBurn > 0 ? Math.floor(g.player.cash / weeklyBurn) : 99;
  return { weeklyBurn, monthlySalaries, runwayWeeks: Math.min(99, runwayWeeks) };
}

    const cat = a.category || "endorse";
    const sub = ACTION_SUB[a.id] || "all";
    if (!buckets[cat]) buckets[cat] = {};
    if (!buckets[cat][sub]) buckets[cat][sub] = [];
    buckets[cat][sub].push(a);
  });

  const renderAction = (a) => {
    const requireOk = !a.requires || a.requires(g);
    const apOk = a.ap <= g.weeklyAP;
    const dis = !requireOk || !apOk;
    if (hideUnavail && dis) return "";
    return `<div class="action ${dis ? "disabled" : ""}" onclick="${dis ? "" : `pickAction('${a.id}')`}" title="${escapeHtml(a.desc)}">
      <div class="name">${a.name}<span class="ap">${a.ap}</span></div>
      <div class="desc">${a.desc}</div>
    </div>`;
  };

  const renderSub = (cat, subKey, items) => {
    if (!items || !items.length) return "";
    const visible = hideUnavail ? items.filter(a => (!a.requires || a.requires(g)) && a.ap <= g.weeklyAP) : items;
    if (!visible.length) return "";
    const subLabel = ACTION_GROUPS[cat].subs[subKey] || "";
    const head = subLabel ? `<div style="font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:6px 2px 2px">${subLabel} <span style="opacity:.6">· ${visible.length}</span></div>` : "";
    return head + `<div class="actions">${items.map(renderAction).join("")}</div>`;
  };

  const renderGroup = (cat) => {
    const group = ACTION_GROUPS[cat];
    if (!group) return "";
    const subs = buckets[cat] || {};
    const totalAvail = Object.values(subs).flat().filter(a => (!a.requires || a.requires(g)) && a.ap <= g.weeklyAP).length;
    const totalAll = Object.values(subs).flat().length;
    const collapsed = g._actionGroupCollapsed[cat];
    const head = `<div class="action-group-head ${collapsed ? "collapsed" : ""}" onclick="toggleActionGroup('${cat}')"><span><span class="label">${group.label}</span> <span class="meta">${totalAvail}/${totalAll} ready</span></span><span class="chevron">▾</span></div>`;
    if (collapsed) return head;
    const subOrder = Object.keys(group.subs);
    const body = subOrder.map(s => renderSub(cat, s, subs[s])).join("");
    return head + body;
  };

  const filterRow = `<div class="action-filter">
    <label><input type="checkbox" ${hideUnavail ? "checked" : ""} onchange="toggleHideUnavail()"> Hide unavailable</label>
    <span style="margin-left:auto; color:var(--muted); font-size:11px">${ACTIONS.length} actions total · hover for details</span>
  </div>`;

  return filterRow + renderGroup("fund") + renderGroup("field") + renderGroup("endorse");
}

function toggleActionGroup(cat) {
  if (!G._actionGroupCollapsed) G._actionGroupCollapsed = {};
  G._actionGroupCollapsed[cat] = !G._actionGroupCollapsed[cat];
  render();
}
function toggleHideUnavail() {
  G._hideUnavailable = !G._hideUnavailable;
  render();
}

function pollingHtml(g) {
  const all = [{ name: g.player.name + " (you)", id: "player", support: g.player.support, kind: "player", nameId: g.player.nameId }, ...g.opponents.map(o => ({ name: o.name, id: o.id, support: o.support, kind: "opp", nameId: o.nameId }))];
  all.sort((a, b) => b.support - a.support);
  const html = `<div class="vote-bar" title="Modeled vote share">${all.slice(0, 4).map((c, i) => {
    const colors = ["#41a6ff", "#ffb000", "#4ec9a3", "#ff6c6c", "#a988ff"];
    const w = Math.max(2, c.support * 100);
    return `<div style="width:${w}%; background:${colors[i % 5]}">${c.id === "player" ? "YOU" : c.name.split(" ").pop()} ${(c.support*100).toFixed(0)}%</div>`;
  }).join("")}</div>
  <table style="margin-top:8px">
    <tr><th>Candidate</th><th>Support</th><th>Name ID</th></tr>
    ${all.map(c => `<tr class="${c.id === "player" ? "you" : ""}"><td>${c.id === "player" ? "<b>" + escapeHtml(g.player.name) + " (you)</b>" : escapeHtml(c.name)}</td><td>${(c.support*100).toFixed(1)}%</td><td>${(c.nameId*100|0)}%</td></tr>`).join("")}
  </table>`;
  return html;
}

function affinityHtml(g) {
  return g.race.blocs.map(b => {
    const aff = g.player.affinity[b.id] || 0;
    const ceiling = playerCeiling(g, b.id);
    const ceilingPct = Math.min(100, ceiling);
    const fitTag = ceiling >= 60 ? '<span class="pill good">strong fit</span>' : ceiling >= 42 ? '<span class="pill">fit</span>' : ceiling >= 28 ? '<span class="pill warn">soft</span>' : '<span class="pill bad">poor fit</span>';
    return `<div class="meter" title="Ceiling ${ceiling.toFixed(0)} based on issue lanes & ethnicity">
      <div class="label" style="width:55%">${b.label} <span class="small">(${b.weight}%)</span> ${fitTag}</div>
      <div class="bar" style="position:relative">
        <div style="width:${Math.min(100, aff)}%"></div>
        <div style="position:absolute; left:${ceilingPct}%; top:-2px; bottom:-2px; width:1px; background:rgba(255,176,0,.6)" title="ceiling"></div>
      </div>
      <div class="val">${aff.toFixed(0)}/${ceiling.toFixed(0)}</div>
    </div>`;
  }).join("");
}

function endorsementsHtml(g) {
  return g.race.endorsers.map(eid => {

      <div class="progress-text">Alignment: ${r.alignment ? r.alignment.toFixed(0) : endorserAlignment(g.player, e).toFixed(0)} / 100 · Priorities: ${e.priorities.map(i => issueLabel(i).split(" ")[0]).join(", ")}</div>

function matchingHtml(g) {
  const need = g.race.qualifyingDonors;

}

function pickAction(aid) {
  const a = ACTIONS.find(x => x.id === aid);
  if (!a) return;
  if (G.weeklyAP < a.ap) return;
  if (a.needsBloc) {
    promptBloc((bid) => { if (bid) { runActionWith(a, bid); } });
    return;
  }
  if (a.needsEndorser) {
    promptEndorser((eid) => { if (eid) { runActionWith(a, eid); } });
    return;
  }
  if (a.needsNeighborhood) {
    promptNeighborhood((nid) => { if (nid) { runActionWith(a, nid); } });
    return;
  }
  if (a.needsReporter) {
    promptReporter((rid) => { if (rid) { runActionWith(a, rid); } });
    return;
  }
  if (a.needsLanguage) {
    promptLanguage((lid) => { if (lid) runActionWith(a, lid); });
    return;
  }
  if (a.needsFaith) {
    promptFaith((fid) => { if (fid) runActionWith(a, fid); });
    return;
  }
  if (a.needsPrecinct) {
    promptPrecinct((pid) => { if (pid) runActionWith(a, pid); });
    return;
  }
  if (a.needsNC) {
    promptNC((ncid) => { if (ncid) runActionWith(a, ncid); });
    return;
  }
  if (a.needsBid) {
    promptBid((bid) => { if (bid) runActionWith(a, bid); });
    return;
  }
  if (a.needsSurrogate) {
    promptSurrogate((sid) => { if (sid) runActionWith(a, sid); });
    return;
  }
  if (a.needsSlate) {
    promptSlate((sid) => { if (sid) runActionWith(a, sid); });
    return;
  }
  if (a.needsAd) {
    promptAd((arg) => { if (arg) runActionWith(a, arg); });
    return;
  }
  if (a.needsMail) {
    promptMail((mid) => { if (mid) runActionWith(a, mid); });
    return;
  }
  if (a.needsOppoStage) {
    promptOppoStage((arg) => { if (arg) runActionWith(a, arg); });
    return;
  }
  if (a.needsVendor) {
    promptVendor((vid) => { if (vid) runActionWith(a, vid); });
    return;
  }
  if (a.needsTexting) {
    promptTexting((tid) => { if (tid) runActionWith(a, tid); });
    return;
  }
  if (a.needsFieldOffice) {
    promptFieldOffice((fid) => { if (fid) runActionWith(a, fid); });
    return;
  }
  if (a.needsSwag) {
    promptSwag((arg) => { if (arg) runActionWith(a, arg); });
    return;
  }
  if (a.needsDebateFmt) {
    promptDebateFmt((fid) => { if (fid) runActionWith(a, fid); });
    return;
  }
  if (a.needsPressTopic) {
    promptPressTopic((tid) => { if (tid) runActionWith(a, tid); });
    return;
  }
  if (a.needsEarnedMedia) {
    promptEarnedMedia((eid) => { if (eid) runActionWith(a, eid); });
    return;
  }
  runActionWith(a);
}

  } catch (err) {

  }
}

// Global error banner — surfaces uncaught errors so clicks never fail silently
function showErrorBanner(msg) {
  let banner = document.getElementById("err-banner");
  if (!banner) {
    banner = document.createElement("div");
    banner.id = "err-banner";
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#5a1a1a;color:#fff;padding:10px 16px;z-index:9999;font-size:13px;border-bottom:2px solid #ff6c6c;display:flex;justify-content:space-between;align-items:center";
    document.body.appendChild(banner);
  }
  const text = document.createElement("span");
  text.textContent = "⚠️ " + String(msg);
  const btn = document.createElement("button");
  btn.textContent = "Dismiss";
  btn.style.cssText = "background:transparent;border:1px solid #fff;color:#fff;padding:4px 10px;border-radius:4px;cursor:pointer";
  btn.addEventListener("click", () => banner.remove());
  banner.innerHTML = "";
  banner.appendChild(text);
  banner.appendChild(btn);
  // Auto-dismiss after 8s
  setTimeout(() => { const b = document.getElementById("err-banner"); if (b) b.remove(); }, 8000);
}

    </div>
  `;
}

function escapeHtml(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function weekToDateStr(week) {
  // Week 1 = Nov 3, 2025 (Monday)
  const start = new Date(2025, 10, 3);
  const d = new Date(start.getTime() + (week - 1) * 7 * 86400000);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function govInitCouncil(){
  const gov=G.gov;
  if (gov.office==="mayor" && gov.mayorWho==="raman") gov.flags.cd4vacant=true;
  govApplyMemberMeta();
  const myAxis=govPlayerAxis();
  GOV_MEMBERS.forEach(m=>{
    if (m.vacant){ gov.councilRel[m.dist]=0; return; }
    if (gov.office==="council" && m.dist===gov.district){ gov.councilRel[m.dist]=100; return; }
    const dist=Math.abs(m.axis.prog-myAxis.prog)+Math.abs(m.axis.police-myAxis.police)+Math.abs(m.axis.business-myAxis.business);
    gov.councilRel[m.dist]=Math.round(Math.max(25,Math.min(75,70-dist/6)));
  });
  GOV_MEMBERS.forEach(m=>{ if(m.vacant) return;
    if (gov.office==="mayor" && gov.mayorWho==="raman" && m.axis.prog>=75) gov.councilRel[m.dist]=Math.min(100,(gov.councilRel[m.dist]||50)+6);
    if (gov.office==="mayor" && gov.mayorWho==="bass"  && m.axis.prog<60)  gov.councilRel[m.dist]=Math.min(100,(gov.councilRel[m.dist]||50)+6);
  });
  GOV_NCS.forEach(n=>gov.ncs[n]=50);
}
function govApplyPerks(){ const gov=G.gov; gov.apMax=4; gov.capRegenBonus=0; gov.traits=[];
  if (gov.office==="mayor" && gov.mayorWho==="raman"){ gov.apMax=5; gov.traits=["Grassroots energy (+1 action point/turn)","Progressive council bloc starts warmer"]; }
  else if (gov.office==="mayor" && gov.mayorWho==="bass"){ gov.capRegenBonus=2; gov.traits=["Institutional clout (+2 capital/turn)","Establishment council starts warmer"]; }
  else if (gov.office==="council"){ gov.traits=["Councilmanic prerogative in "+gov.district]; }
  gov.ap=gov.apMax;
}

// ---- Coalition / whip model ------------------------------------------------
function govRel(dist){ return G.gov.councilRel[dist] ?? 50; }
function govMemberLean(m, bill){
  let s=0,n=0; for (const ax in bill.appeal){ s+=bill.appeal[ax]*((m.axis[ax]-50)/50); n+=Math.abs(bill.appeal[ax]); }
  const align=n?(s/n)*100:0;
  return 50 + align*0.42 + (govRel(m.dist)-50)*0.5;
}
function govMemberScore(m, ini){ const bill=govBill(ini.billId); const whip=(ini.whip&&ini.whip[m.dist])||0; return govMemberLean(m,bill)+whip; }
function govPredict(m, ini){ const sc=govMemberScore(m,ini); return sc>=58?"yes":sc>=45?"lean":"no"; }
function govWhipCount(ini){
  let yes=0;
  GOV_MEMBERS.forEach(m=>{ if(m.vacant) return;
    if (G.gov.office==="council" && m.dist===G.gov.district){ yes++; return; }
    if (govMemberScore(m,ini)>=50) yes++; });
  return yes;
}

// ---- Actions: spending -----------------------------------------------------
function govSpendAP(n){ if(G.gov.ap<n){ govLog("Not enough action points this turn."); return false; } G.gov.ap-=n; return true; }

function govIntroduce(billId){
  const gov=G.gov;
  if (gov.initiatives.find(i=>i.billId===billId)){ govLog("That bill is already in the pipeline."); render(); return; }
  if (!govSpendAP(1)){ render(); return; }
  const b=govBill(billId); const c=govBillComm(b);
  gov.initiatives.push({ billId, stage:"committee", whip:{}, fileNo:(++gov.fileSeq)+"-S", reported:false });
  govLog("Introduced “"+b.title+"” — referred to "+c.name+" (CF "+gov.fileSeq+"-S).");
  render();
}
function govWhip(billId){
  const gov=G.gov; const ini=gov.initiatives.find(i=>i.billId===billId); if(!ini) return;
  if (gov.capital<8){ govLog("Need 8 political capital to whip votes."); render(); return; }
  if (!govSpendAP(1)){ render(); return; }
  gov.capital-=8;
  const persuadable=GOV_MEMBERS.filter(m=>!m.vacant&&!(gov.office==="council"&&m.dist===gov.district))
    .map(m=>({m,sc:govMemberScore(m,ini)})).filter(x=>x.sc<58).sort((a,b)=>b.sc-a.sc).slice(0,3);
  persuadable.forEach(x=>{ ini.whip[x.m.dist]=(ini.whip[x.m.dist]||0)+9; gov.councilRel[x.m.dist]=Math.min(100,govRel(x.m.dist)+2); });
  govLog("Whipped votes on “"+govBill(billId).title+"” — leaned on "+persuadable.map(x=>x.m.dist).join(", ")+".");
  render();
}
function govCommitteeInfo(billId){
  const gov=G.gov; const b=govBill(billId); const c=govBillComm(b); const chair=govMember(c.chair); const chairLean=govMemberLean(chair,b);
  const iChair = gov.office==="council" && c.chair===gov.district;
  const iMember = gov.office==="council" && c.members.includes(gov.district);
  const cost = iChair?0 : iMember?4 : chairLean>=50?3 : chairLean>=40?7 : 10;
  const posture = chairLean>=50?"friendly":chairLean>=40?"cool":"hostile";
  return {b,c,chair,chairLean,iChair,iMember,cost,posture};
}
function govCommitteePush(billId){
  const gov=G.gov; const ini=gov.initiatives.find(i=>i.billId===billId); if(!ini||ini.stage!=="committee") return;
  const info=govCommitteeInfo(billId);
  if (gov.capital<info.cost){ govLog("The "+info.c.name+" chair ("+info.chair.dist+") is bottling this up \u2014 need "+info.cost+" capital to force it out (you have "+gov.capital+")."); render(); return; }
  if (!govSpendAP(1)){ render(); return; }
  gov.capital-=info.cost;
  ini.stage="floor"; ini.reported=true;
  govLog("\u201c"+info.b.title+"\u201d reported out of "+info.c.name+(info.cost?" (spent "+info.cost+" capital to move a "+info.posture+" chair)":"")+" \u2192 full Council.");
  render();
}
function govFloorVote(billId){
  const gov=G.gov; const ini=gov.initiatives.find(i=>i.billId===billId); if(!ini||ini.stage!=="floor") return;
  const b=govBill(billId); const yes=govWhipCount(ini); const pass=yes>=b.threshold;
  // capture per-seat votes for the tally UI
  ini.tally=GOV_MEMBERS.map(m=>{ if(m.vacant) return {dist:m.dist,vote:"vac"}; if(gov.office==="council"&&m.dist===gov.district) return {dist:m.dist,vote:"yes"}; return {dist:m.dist,vote:govMemberScore(m,ini)>=50?"yes":"no"}; });
  gov.lastTally={ billId, title:b.title, yes, threshold:b.threshold, pass, seats:ini.tally };
  gov.initiatives=gov.initiatives.filter(i=>i!==ini);
  if (!pass){ govLog("✗ FAILED on the floor: “"+b.title+"” — "+yes+"/15 (needed "+b.threshold+")."); render(); return; }
  if (gov.office==="mayor"){ govEnact(b,yes,false); }
  else {
    const bassAxis={prog:62,dev:60,police:60,labor:62,business:55};
    let s=0,n=0; for(const ax in b.appeal){ s+=b.appeal[ax]*((bassAxis[ax]-50)/50); n+=Math.abs(b.appeal[ax]); }
    const mayorLean=50+(n?(s/n)*100:0)*0.45;
    if (mayorLean>=45) govEnact(b,yes,false);
    else govMayorVeto(b,yes);
  }
  render();
}
function govEnact(b, yes, overrode){
  G.gov.passedLaws.push({ billId:b.id, title:b.title, turn:G.gov.turn, yes, overrode:!!overrode });
  G.gov.legacy.lawsPassed++;
  applySeg(b.seg,1); applyDept(b.dept,1); G.gov.capital=Math.min(100,G.gov.capital+4); govPolicyEffect(b.id);
  govLog("✔ ENACTED: “"+b.title+"” ("+yes+"/15"+(overrode?", override":"")+"). Signed into law.");
}
function govMayorVeto(b, yes){
  const ini={ billId:b.id, whip:{} }; const ov=govWhipCount(ini);
  if (ov>=10){ govEnact(b,ov,true); govLog("Mayor vetoed “"+b.title+"” — Council OVERRODE "+ov+"/15."); }
  else { G.gov.vetoedLaws.push({ billId:b.id, title:b.title, turn:G.gov.turn }); govLog("✗ Mayor VETOED “"+b.title+"”. Override fell short ("+ov+"/15, needed 10)."); }
}

function govAppoint(postId, candIdx){
  const gov=G.gov; if(gov.office!=="mayor"){ govLog("Only the Mayor appoints."); render(); return; }
  if (gov.pendingConfirm){ govLog("Resolve the pending confirmation first."); render(); return; }
  if (!govSpendAP(1)){ render(); return; }
  if (gov.filledPosts && gov.filledPosts[postId]){ govLog("That post is already filled — use Replace to change it."); render(); return; }
  const post=GOV_POSTS.find(p=>p.id===postId); const cand=post.cands[candIdx];
  gov.pendingConfirm={ postId, candIdx, name:cand.name, post:post.post, dept:post.dept, health:cand.health||0, seg:cand.seg, cap:cand.cap||0, scandal:cand.scandal||0, sentTurn:gov.turn };
  govLog("Nominated "+cand.name+" for "+post.post+" — sent to Council for confirmation (45-day window).");
  render();
}
function govResolveConfirm(force){
  const gov=G.gov; const pc=gov.pendingConfirm; if(!pc) return;
  // council confirmation vote (needs 8); model with a synthetic bill aligned to the appointee
  const synth={ appeal:{ prog: pc.seg && pc.seg.progressives?0.4:0, business: pc.seg&&pc.seg.business?0.3:0, police: pc.dept==="police"?0.3:0 } };
  let yes=0; GOV_MEMBERS.forEach(m=>{ if(m.vacant)return; if(gov.office==="council"&&m.dist===gov.district){yes++;return;}
    let s=0,n=0; for(const ax in synth.appeal){ s+=synth.appeal[ax]*((m.axis[ax]-50)/50); n+=Math.abs(synth.appeal[ax]); }
    const lean=50+(n?(s/n)*100:0)*0.4+(govRel(m.dist)-50)*0.4; if(lean>=49)yes++; });
  const confirmed=yes>=8;
  if (confirmed){
    const dep=govDept(pc.dept);
    if (dep && gov.deptHealth[pc.dept]!==undefined && pc.health){ dep.head=pc.name; gov.deptHealth[pc.dept]=Math.min(100,gov.deptHealth[pc.dept]+pc.health); }
    applySeg(pc.seg,1);
    if (pc.cap) gov.capital=Math.min(100,gov.capital+pc.cap);
    if (pc.scandal) gov.scandalRisk=Math.max(0,gov.scandalRisk+pc.scandal);
    gov.legacy.confirmations++;
    gov.filledPosts[pc.postId]=pc.name;
    gov.appointments.push({ post:pc.post, name:pc.name, dept:pc.dept, status:"confirmed" });
    govLog("✔ Council CONFIRMED "+pc.name+" as "+pc.post+" ("+yes+"/15)."+(dep?" "+dep.name+" strengthened.":""));
  } else {
    gov.appointments.push({ post:pc.post, name:pc.name, dept:pc.dept, status:"rejected" });
    govLog("✗ Council REJECTED "+pc.name+" for "+pc.post+" ("+yes+"/15, needed 8).");
  }
  gov.pendingConfirm=null; render();
}

// ---- Budget ----------------------------------------------------------------
function govStartBudget(yr){ G.gov.budget={ yr, draft:Object.assign({},G.gov.budgetAlloc) }; govLog("📋 FY"+(yr+1)+" budget season — propose your allocation (Apr 20) and adopt by Jun 1."); }
function govBudgetAdjust(deptId, delta){
  const gov=G.gov; if(!gov.budget) return; const d=gov.budget.draft;
  const nv=(d[deptId]||0)+delta; if(nv<0) return;
  const total=GOV_DEPTS.reduce((s,x)=>s+(x.id===deptId?nv:d[x.id]),0);
  if (total>GOV_BUDGET_TOTAL){ govLog("Over budget — pull points from another department first."); render(); return; }
  d[deptId]=nv; render();
}
function govBudgetAdopt(){
  const gov=G.gov; if(!gov.budget) return;
  const total=GOV_DEPTS.reduce((s,x)=>s+gov.budget.draft[x.id],0);
  if (total<GOV_BUDGET_TOTAL){ /* allow underspend → padding to reserve */ gov.reserve=Math.min(20,gov.reserve+(GOV_BUDGET_TOTAL-total)*0.3); }
  gov.budgetAlloc=Object.assign({},gov.budget.draft);
  // approval reaction by where the money went
  const a=gov.budgetAlloc;
  if (a.police>=14) bumpApproval({publicSafety:+4,progressives:-3}); if(a.homeless>=14) bumpApproval({progressives:+3,homeowners:+2});
  if (a.housing>=14) bumpApproval({renters:+4});
  gov.budgetsAdopted++; gov.lastBudgetYear=gov.budget.yr; gov.budget=null; gov.capital=Math.min(100,gov.capital+5);
  govLog("Adopted the FY budget (majority of the Council). Department targets updated.");
  render();
}

// ---- approval & dept helpers ----------------------------------------------
function bumpApproval(obj){ const a=G.gov.approval; Object.keys(obj).forEach(k=>{ if(a[k]!==undefined) a[k]=clamp(a[k]+obj[k]); }); govRecalcOverall(); }
function applySeg(seg,mul){ if(!seg)return; const a=G.gov.approval; Object.keys(seg).forEach(k=>{ if(a[k]!==undefined) a[k]=clamp(a[k]+seg[k]*mul); }); govRecalcOverall(); }
function applyDept(dept,mul){ if(!dept)return; Object.keys(dept).forEach(k=>{ if(G.gov.deptHealth[k]!==undefined) G.gov.deptHealth[k]=clamp(G.gov.deptHealth[k]+dept[k]*mul); }); }
function clamp(v){ return Math.max(0,Math.min(100,Math.round(v))); }
function govRecalcOverall(){ const a=G.gov.approval; const keys=["progressives","moderates","business","homeowners","renters","publicSafety","labor","latino"]; const avg=keys.reduce((s,k)=>s+a[k],0)/keys.length; a.overall=Math.round(a.overall*0.5+avg*0.5); }
function govCapitalRegen(){ return 6+Math.round((G.gov.approval.overall-50)/10)+(G.gov.capRegenBonus||0); } // political capital regained per 2-week turn (scales with approval)

// ---- Turn advance ----------------------------------------------------------
function govAdvanceTurn(){
  const gov=G.gov; govEnsure();
  if (gov.pendingGovEvent){ govLog("Resolve the current situation first."); render(); return; }
  // probe trigger
  if (gov.flags.tookDeveloperMoney && !gov.flags.probeFired && Math.random()<0.20){ gov.flags.probeFired=true; gov.pendingGovEvent=govProbeStage("probe1"); render(); return; }
  const dueC = gov.pendingConsequences && gov.pendingConsequences.find(x=>x.turn<=gov.turn);
  if (dueC){ gov.pendingConsequences=gov.pendingConsequences.filter(y=>y!==dueC); gov.pendingGovEvent=govConsequenceEvent(dueC.type); render(); return; }
  // prerogative item for council players
  if (gov.office==="council" && Math.random()<0.10){ gov.pendingGovEvent=GOV_PROEROG; render(); return; }
  if (Math.random()<0.65){ const ev=govPickEvent(); if(ev){ gov.pendingGovEvent=ev; render(); return; } }
  govEndTurnTicks();
}
function govPickEvent(){ const W=GOV_EVENTS.reduce((s,e)=>s+e.w,0); let r=Math.random()*W; for(const e of GOV_EVENTS){ r-=e.w; if(r<=0) return e; } return GOV_EVENTS[0]; }
function govApplyEff(eff){
  const gov=G.gov; if(!eff) return;
  if (eff.seg) applySeg(eff.seg,1);
  if (eff.dept) applyDept(eff.dept,1);
  if (eff.cap) gov.capital=clamp(gov.capital+eff.cap);
  if (eff.warChest) gov.warChest+=eff.warChest;
  if (eff.scandal) gov.scandalRisk=Math.max(0,gov.scandalRisk+eff.scandal);
  if (eff.reserve) gov.reserve=Math.max(0,gov.reserve+eff.reserve);
  if (eff.flag) gov.flags[eff.flag]=true;
}
function govResolveEvent(idx){
  const gov=G.gov; const ev=gov.pendingGovEvent; if(!ev) return; const ch=ev.choices[idx];
  govApplyEff(ch.eff);
  if(ch.pipe==="cut"){ G.gov.pipelines.forEach(p=>{ if(p.kind==="housing") p.turnsLeft=Math.max(0,Math.round(p.turnsLeft/2)); }); }
  if (ev.prerog) gov.prerogItems++;
  // probe chain
  if (ev.id && ev.id.indexOf("probe")===0){
    gov.legacy.scandalsSurvived++;
    if (ch.next && !ev.end){ gov.pendingGovEvent=govProbeStage(ch.next); render(); return; }
    gov.pendingGovEvent=null; govLog("["+ev.title+"] → "+ch.label); govEndTurnTicks(); return;
  }
  gov.legacy.crisesHandled++;
  govLog("["+ev.title+"] → "+ch.label);
  gov.pendingGovEvent=null; govEndTurnTicks();
}
function govEndTurnTicks(){
  const gov=G.gov;
  // department health drifts toward budget-implied target
  GOV_DEPTS.forEach(d=>{ const alloc=gov.budgetAlloc[d.id]??10; const target=Math.max(15,Math.min(90, d.base + (alloc-10)*4)); gov.deptHealth[d.id]=Math.round(gov.deptHealth[d.id]+(target-gov.deptHealth[d.id])*0.18); });
  // neglected departments hurt their segment + raise crisis odds
  let neglect=0;
  GOV_DEPTS.forEach(d=>{ if(gov.deptHealth[d.id]<35){ neglect++; const a=gov.approval; if(a[d.seg]!==undefined){ a[d.seg]=clamp(a[d.seg]-1); } } });
  govRecalcOverall();
  // scandal check
  if (gov.scandalRisk>45 && Math.random()<(gov.scandalRisk-45)/120){ bumpApproval({overall:-6,progressives:-4}); gov.scandalRisk=Math.max(10,gov.scandalRisk-15); govLog("⚠ A scandal story broke — approval took a hit."); }
  // capital regen + decay
  gov.capital=Math.min(100, gov.capital+govCapitalRegen());
  gov.scandalRisk=Math.max(0, gov.scandalRisk-1+neglect);
  // mild mean-reversion
  GOV_SEGMENTS.forEach(([k])=>{ if(k!=="overall"){ const a=gov.approval; a[k]=Math.round(a[k]+(50-a[k])*0.03); }});
  govRecalcOverall();
  gov.turn++; gov.ap=gov.apMax;
  gov.approvalHistory.push({ turn:gov.turn, v:gov.approval.overall }); if(gov.approvalHistory.length>120) gov.approvalHistory.shift();
  govCityTick();
  // pending confirmation auto-resolves if the 45-day (~3 turn) window lapses
  if (gov.pendingConfirm && gov.turn-gov.pendingConfirm.sentTurn>=3){ govLog("The 45-day confirmation window lapsed — resolving by default."); govResolveConfirm(true); }
  // budget season (annual, ~April)
  const d=govDate(gov.turn), yr=d.getFullYear();
  if (d.getMonth()===3 && gov.lastBudgetYear!==yr && !gov.budget){ govStartBudget(yr); }
  // measure elections (November of even years)
  if (d.getMonth()===10){ govResolveMeasures(yr); }
  // re-election
  if (yr>=2030 && d.getMonth()>=10 && !gov.reelectionResolved){ govResolveReelection(); }
  save(); render();
}
function govResolveMeasures(yr){
  const gov=G.gov;
  gov.measures.filter(m=>m.result===null && m.electionYear===yr).forEach(m=>{
    const meas=GOV_MEASURES.find(x=>x.id===m.id);
    const pass=(m.support + (gov.approval.overall-50)*0.2) >= 50;
    m.result=pass?"passed":"failed";
    if (pass){ applySeg(meas.seg,1); gov.legacy.measuresPassed++; }
    govLog((pass?"🗳 PASSED":"🗳 FAILED")+" at the ballot: “"+meas.title+"” (~"+Math.round(m.support)+"%).");
  });
}
function govResolveReelection(){
  const gov=G.gov; gov.reelectionResolved=true;
  const ap=gov.approval.overall; const warBonus=Math.min(10,gov.warChest/60000);
  const scandalPen=gov.flags.probeOpen?20:(gov.scandalRisk>40?8:0);
  const deptAvg=GOV_DEPTS.reduce((s,d)=>s+gov.deptHealth[d.id],0)/GOV_DEPTS.length;
  const deptBonus=(deptAvg-50)*0.2;
  const score=ap+warBonus+deptBonus-scandalPen;
  gov.reelectionResult={ won:score>=50, score:Math.round(score), ap, warBonus:Math.round(warBonus), deptBonus:Math.round(deptBonus), scandalPen };
  G.phase="gov-over"; govLog(gov.reelectionResult.won?"🏆 You WON re-election.":"🗳 You LOST re-election."); save();
}

function govStartPipeline(p){ const ex=G.gov.pipelines.find(x=>x.id===p.id); if(ex){ ex.turnsLeft=Math.max(ex.turnsLeft,p.turnsLeft); ex.mag=Math.max(ex.mag,p.mag); } else G.gov.pipelines.push(p); }
function govPlantConsequence(turnsAhead,type){ G.gov.pendingConsequences.push({ turn:G.gov.turn+turnsAhead, type }); }
function govPolicyEffect(billId){
  const gov=G.gov, c=gov.city; if(!c) return;
  switch(billId){

function govCityTick(){
  const gov=G.gov, c=gov.city, dh=gov.deptHealth; if(!c) return;
  let policeAdds=0, shelterMoves=0, housingDone=0, housingAff=0, inflowReduce=0, sweepReduce=0, safetyProg=0;
  gov.pipelines.forEach(p=>{ if(p.turnsLeft<=0) return;
    if(p.fundRisk && Math.random()<p.fundRisk){ p.turnsLeft=Math.max(0,p.turnsLeft-2); govLog("\u26a0 Funding for "+p.label+" was cut by another government \u2014 progress slowed."); }
    if(p.kind==="police") policeAdds+=p.mag;
    else if(p.kind==="shelter") shelterMoves+=p.mag;
    else if(p.kind==="housing"){ housingDone+=p.mag; housingAff+=Math.round(p.mag*(p.affShare||0.5)); }
    else if(p.kind==="protect") inflowReduce+=p.mag;
    else if(p.kind==="sweep") sweepReduce+=p.mag;
    else if(p.kind==="safety") safetyProg+=p.mag;
    p.turnsLeft--; });
  gov.pipelines=gov.pipelines.filter(p=>p.turnsLeft>0);
  c.lapdSworn=Math.max(7000, c.lapdSworn-15+policeAdds);
  const planMul=0.6+((dh.planning||50)/100);
  const built=Math.round(housingDone*planMul);
  c.homesBuilt+=built; c.homesAffordable+=Math.round(housingAff*planMul); c.housingPipeline=Math.max(0,c.housingPipeline-built);
  const rentPressure=(60-(dh.housing||45))/40;
  let inflow=Math.max(0, 220+Math.round(rentPressure*120)-inflowReduce-Math.round(built*0.3));
  let exits=120+Math.round(((dh.homeless||40)/100)*120);
  const moved=Math.max(0, Math.min(c.homelessUnsheltered, shelterMoves));
  const returns=Math.round(moved*0.40);
  c.homelessUnsheltered=Math.max(0, c.homelessUnsheltered+inflow-exits-moved-sweepReduce+returns);
  c.homelessSheltered=Math.max(0, c.homelessSheltered+moved-returns-Math.round(exits*0.3));
  const copFactor=(8600-c.lapdSworn)/200;
  const homelessFactor=(c.homelessUnsheltered-27000)/3000;
  const safetyHealth=(50-(dh.police||50))/20;
  let crimeTarget=46+copFactor+homelessFactor+safetyHealth-safetyProg*1.5;
  c.crimeIndex=Math.max(10,Math.min(95, Math.round(c.crimeIndex+(crimeTarget-c.crimeIndex)*0.2)));
  const tot=c.homelessUnsheltered+c.homelessSheltered;
  c.hist.homeless.push(tot); c.hist.homes.push(c.homesBuilt); c.hist.lapd.push(c.lapdSworn); c.hist.crime.push(c.crimeIndex);
  ["homeless","homes","lapd","crime"].forEach(k=>{ if(c.hist[k].length>120) c.hist[k].shift(); });
  if(built>0) bumpApproval({renters:+1});
  if(moved>returns) bumpApproval({homeowners:+1,overall:+1});
  if(c.crimeIndex>62) bumpApproval({publicSafety:-1,homeowners:-1});
  if(tot>46000) bumpApproval({overall:-1});
}

function govSpark(series,color){ if(!series||series.length<2) return ""; const W=150,H=34,p=3; const min=Math.min.apply(null,series),max=Math.max.apply(null,series); const rng=(max-min)||1; const x=i=>p+i*(W-2*p)/(series.length-1); const y=v=>H-p-((v-min)/rng)*(H-2*p); let d=series.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" "); return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/></svg>`; }

function govSparkline(){

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><line x1="${pad}" y1="${ys(50)}" x2="${W-pad}" y2="${ys(50)}" stroke="var(--line)" stroke-dasharray="3 3"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;

    const stageLabel = ini.stage==="committee"?`In ${c.name} (chair ${c.chair}${chairLean<40?' — hostile':chairLean<50?' — cool':' — friendly'})`:"On the Council floor";
    // whip board
    const chips=GOV_MEMBERS.map(m=>{ if(m.vacant) return `<span class="govchip" style="opacity:.3">${m.dist}</span>`;

    let controls;

      const info=govCommitteeInfo(b.id);

  // last vote tally
  let tally="";
  if (gov.lastTally){ const lt=gov.lastTally; const seats=lt.seats.map(s=>{ const col=s.vote==="yes"?'var(--good)':s.vote==="no"?'var(--bad)':'var(--line)'; return `<span class="govseat" title="${s.dist}" style="background:${col}"></span>`; }).join("");
    tally=`<div class="panel" style="margin:8px 0"><h3>Last floor vote — ${escapeHtml(lt.title)}</h3><div style="display:flex;gap:5px;flex-wrap:wrap;margin:6px 0">${seats}</div><div class="small"><b style="color:${lt.pass?'var(--good)':'var(--bad)'}">${lt.pass?'PASSED':'FAILED'} ${lt.yes}/15</b> (needed ${lt.threshold})</div></div>`; }
  const inPipe=new Set(gov.initiatives.map(i=>i.billId).concat(gov.passedLaws.map(l=>l.billId)));
  let menu=GOV_BILLS.filter(b=>!inPipe.has(b.id)).map(b=>`<button class="btn small" style="text-align:left;margin:4px 0;display:block;width:100%" onclick="govIntroduce('${b.id}')">+ ${escapeHtml(b.title)} <span class="small">· ${govBillComm(b).name}</span></button>`).join("");
  let passed=gov.passedLaws.length?`<div class="panel" style="margin-top:10px"><h3>Enacted this term</h3>`+gov.passedLaws.map(l=>`<div class="small">✔ ${escapeHtml(l.title)} (${l.yes}/15${l.overrode?", override":""})</div>`).join("")+`</div>`:"";
  return `<div class="grid cols-2" style="gap:12px"><div><h3>Pipeline & whip board</h3>${active}${tally}</div>
    <div class="panel"><h3>Introduce a bill (−1 AP)</h3>${menu||'<span class="small">All bills introduced.</span>'}</div></div>${passed}`;
}

function govViewCouncil(){
  const gov=G.gov;
  const cards=GOV_MEMBERS.map(m=>{
    const you=gov.office==="council"&&m.dist===gov.district; const rel=m.vacant?0:(you?100:govRel(m.dist));
    const chairs=govChairsOf(m.dist).map(c=>c.id.toUpperCase());
    const av=`<div style="width:34px;height:34px;border-radius:50%;background:${m.vacant?'var(--line)':'var(--panel2)'};border:1px solid ${you?'var(--accent)':'var(--line)'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:${you?'var(--accent)':'var(--text)'}">${m.vacant?'—':govInitials(m.name)}</div>`;
    return `<div class="panel" style="padding:10px">
      <div style="display:flex;gap:8px;align-items:center">${av}<div><b>${m.dist}</b> ${you?'<span class="small" style="color:var(--accent)">(you)</span>':''}<br><span class="small">${escapeHtml(m.name)}</span></div></div>
      <div class="small" style="color:var(--muted);margin:3px 0">${escapeHtml(m.lane)}${chairs.length?` · chairs ${chairs.join(",")}`:''}${m.dist==='CD8'?' · President':''}</div>
      ${m.vacant?'<div class="small" style="color:var(--warn)">Seat vacant</div>':`
      <div style="margin:4px 0">${govMiniBar("prog",m.axis.prog)}${govMiniBar("police",m.axis.police)}${govMiniBar("business",m.axis.business)}${govMiniBar("labor",m.axis.labor)}</div>
      ${govBar("With you",rel,govColor(rel))}`}
    </div>`;
  }).join("");
  const vac = gov.flags.cd4vacant ? `<div class="panel" style="margin-bottom:10px;border-color:var(--warn)"><h3>CD4 vacancy (\u00a7409)</h3><p class="small">You vacated CD4 to become Mayor. The Council fills the seat by appointment, or you can let voters decide in a special election. Back a candidate to seat your 15th vote (\u22121 AP):</p>`+GOV_CD4_FILL.map(c=>`<button class="btn small" style="display:block;text-align:left;margin:4px 0;width:100%" onclick="govFillCD4('${c.id}')">${escapeHtml(c.name)} \u2014 <span class="small">${escapeHtml(c.note)}</span></button>`).join("")+`</div>` : "";
  return vac + `<div class="panel" style="margin-bottom:10px"><h3>The 15-member Council</h3><p class="small">Pass at <b>8</b>, override a veto at <b>10</b>, urgency/charter at <b>12</b>. Progressive/DSA bloc (CD1, 4, 13, 14 + allies) is a minority — build to 8. President Harris-Dawson (CD8) controls committee assignments.</p></div>
    <div class="grid cols-3" style="gap:10px">${cards}</div>`;
}

function govViewBudget(){
  const gov=G.gov;
  if (!gov.budget){
    const rows=GOV_DEPTS.map(d=>`<div class="small" style="display:flex;justify-content:space-between;padding:2px 0"><span>${d.name} <span style="color:var(--muted)">(${gov.budgetAlloc[d.id]} pts)</span></span><b style="color:${govColor(gov.deptHealth[d.id])}">health ${gov.deptHealth[d.id]}</b></div>`).join("");
    return `<div class="panel"><h3>Budget — no cycle pending</h3><p class="small">FY runs Jul 1–Jun 30: Mayor submits by <b>Apr 20</b>, Council adopts (majority 8) by <b>Jun 1</b>. Current allocation & department health:</p>${rows}<p class="small" style="margin-top:6px">Reserve fund: <b>${gov.reserve.toFixed(1)}%</b> (2.75% legal floor) · Budgets adopted: <b>${gov.budgetsAdopted}</b>. The next cycle opens each spring.</p></div>`;
  }
  const d=gov.budget.draft; const total=GOV_DEPTS.reduce((s,x)=>s+d[x.id],0); const free=GOV_BUDGET_TOTAL-total;
  const rows=GOV_DEPTS.map(dp=>{ const target=Math.max(15,Math.min(90,dp.base+(d[dp.id]-10)*4));
    const minus=d[dp.id]<=0?'disabled':''; const plus=free<=0?'disabled':'';
    return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span class="small" style="width:150px">${dp.name}</span>
      <button class="btn small" onclick="govBudgetAdjust('${dp.id}',-1)" ${minus}>-</button><b style="width:24px;text-align:center">${d[dp.id]}</b><button class="btn small" onclick="govBudgetAdjust('${dp.id}',1)" ${plus}>+</button>
      <span class="small" style="color:var(--muted)">\u2192 health target ~${target} (now ${gov.deptHealth[dp.id]})</span></div>`; }).join("");
  return `<div class="panel"><h3>FY${gov.budget.yr+1} budget \u2014 ${GOV_BUDGET_TOTAL} points</h3>
    <p class="small">${gov.office==="mayor"?"You propose; the Council adopts by majority.":"The Mayor proposed; you shape adoption."} <b>Unallocated: <span style="color:${free>0?'var(--accent)':'var(--muted)'}">${free}</span></b> ${free<=0?'<span class="small" style="color:var(--warn)">\u2014 it\u2019s a fixed pie: reduce a department (\u2212) to free points, then add (+) elsewhere.</span>':'<span class="small">\u2014 assign to priorities with (+).</span>'}</p>
    ${rows}
    <div class="row" style="margin-top:10px"><button class="btn primary" onclick="govBudgetAdopt()">Adopt budget${free>0?` (${free} \u2192 reserve)`:''}</button></div>
    <p class="small" style="margin-top:6px;color:var(--muted)">Real context: FY26-27 ~$14.9B, ~$25M gap after last year\u2019s ~$1B deficit.</p></div>`;
}

function govViewAppointments(){
  const gov=G.gov;
  let pending = gov.pendingConfirm? `<div class="panel" style="margin-bottom:10px"><h3>Awaiting Council confirmation</h3>
    <p class="small"><b>${escapeHtml(gov.pendingConfirm.name)}</b> for <b>${escapeHtml(gov.pendingConfirm.post)}</b> — 45-day window (auto-resolves in ${Math.max(0,3-(gov.turn-gov.pendingConfirm.sentTurn))} turns).</p>
    <button class="btn small primary" onclick="govResolveConfirm()">Call the confirmation vote now</button></div>` : "";
  let posts = GOV_POSTS.map(p=>{ const d=govDept(p.dept); const filled=gov.filledPosts&&gov.filledPosts[p.id];
    const inner = filled
      ? `<p class="small">${escapeHtml(p.note)}<br><span style="color:var(--good)">✔ Appointed: <b>${escapeHtml(filled)}</b></span></p><div><button class="btn small" onclick="govReplacePost('${p.id}')" ${gov.pendingConfirm?'disabled':''}>Replace appointee</button></div>`
      : `<p class="small">${escapeHtml(p.note)} ${d&&d.head?`<br>Current: <b>${escapeHtml(d.head)}</b>`:''}</p><div>`+p.cands.map((c,i)=>`<button class="btn small" style="margin:3px 4px 0 0" onclick="govAppoint('${p.id}',${i})" ${gov.pendingConfirm?'disabled':''}>Nominate: ${escapeHtml(c.name)} (+${c.health})</button>`).join("")+`</div>`;
    return `<div class="panel" style="margin:8px 0"><b>${escapeHtml(p.post)}</b> <span class="small">· ${d?d.name+' · health '+gov.deptHealth[p.dept]:'council-confirmed'}</span>${inner}</div>`; }).join("");
  let history = gov.appointments.length? `<div class="panel" style="margin-top:8px"><h3>Appointment record</h3>`+gov.appointments.map(ap=>`<div class="small">${ap.status==="confirmed"?'✔':'✗'} ${escapeHtml(ap.name)} — ${escapeHtml(ap.post)} (${ap.status})</div>`).join("")+`</div>`:"";
  return `<h3>Mayoral appointments</h3><p class="small">Appoint GMs & commission heads (−1 AP); the Council confirms by majority (8), with a 45-day default-approval window. Strong picks raise department health.</p>${pending}${posts}${history}`;
}
function govViewConfirm(){
  const gov=G.gov;
  if (gov.pendingConfirm){ return `<div class="panel"><h3>Mayoral appointment before the Council</h3>
    <p class="small">The Mayor has nominated <b>${escapeHtml(gov.pendingConfirm.name)}</b> for <b>${escapeHtml(gov.pendingConfirm.post)}</b>. As a councilmember you weigh in on confirmation (needs 8 of 15).</p>
    <button class="btn small primary" onclick="govResolveConfirm()">Take up the confirmation vote</button></div>`; }
  return `<div class="panel"><h3>Confirmations</h3><p class="small">No mayoral appointment is pending before the Council right now. When the Mayor nominates a GM or commissioner, you'll vote on confirmation here (45-day default-approval window).</p></div>`;
}

function govViewDistrict(){
  const gov=G.gov;
  const ncs=Object.keys(gov.ncs).map(n=>`<div style="margin:4px 0">${govBar(n,gov.ncs[n],govColor(gov.ncs[n]))}<button class="btn small" onclick="govNCMeeting('${escapeHtml(n).replace(/'/g,'')}')">Attend meeting (−1AP)</button></div>`).join("");
  return `<div class="panel"><h3>${gov.district} — your district</h3>
    <p class="small">Neighborhood councils are advisory but file <b>Community Impact Statements</b> the Council reads. Attend to build local goodwill. On land-use, <b>councilmanic prerogative</b> means your colleagues follow your lead in your district — real power, and the classic LA corruption temptation (Huizar, 13 years).</p>
    ${ncs}
    <p class="small" style="margin-top:8px">Land-use items handled: <b>${gov.prerogItems}</b>. Developer projects will periodically land on your desk — how you handle them builds capital or scandal risk.</p></div>`;
}
function govViewCitywide(){
  const gov=G.gov;
  const order=["safety","homeless","permit","climate"];
  const rows=order.map(k=>{ const m=GOV_DIRECTIVES[k]; const h=gov.deptHealth[m.dept];
    return `<div class="panel" style="margin:8px 0;padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>${m.label}</b><span class="small">${govDept(m.dept).name} health <b style="color:${govColor(h)}">${h}</b></span></div>
      <div style="height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0"><div style="height:100%;width:${h}%;background:${govColor(h)}"></div></div>
      <div class="small" style="color:var(--muted);margin-bottom:7px">${m.eff}</div>
      <button class="btn small" onclick="govDirective('${k}')" ${gov.ap<1?'disabled':''}>Issue directive (\u22121 AP)</button>
    </div>`; }).join("");
  const last=gov.lastDirective?`<p class="small" style="color:var(--good)">\u2714 Last directive: ${escapeHtml(gov.lastDirective.label)} \u2014 +${gov.lastDirective.gain} ${escapeHtml(gov.lastDirective.dept)} health (${govDateStr(gov.lastDirective.turn)}).</p>`:"";
  return `<div class="panel" style="margin-bottom:10px"><h3>Executive directives</h3>
    <p class="small">Your directives are binding on departments (effective 15 days after publication). Each costs 1 AP and visibly raises that department\u2019s health \u2014 with diminishing returns as it gets healthier \u2014 plus shifts the related voter bloc. ${gov.ap<1?'<span style="color:var(--warn)">No AP left this turn \u2014 Advance 2 weeks to refresh.</span>':''}</p>
    ${last}</div>${rows}`;
}
const GOV_DIRECTIVES={
  safety:{dept:"police", seg:{publicSafety:3,progressives:-2}, label:"Speed LAPD hiring", eff:"+LAPD health \u00b7 +public-safety \u00b7 \u2212progressives"},
  homeless:{dept:"homeless", seg:{progressives:2,homeowners:2}, label:"Inside Safe surge", eff:"+Homelessness health \u00b7 +progressives & homeowners"},
  permit:{dept:"planning", seg:{business:3,homeowners:2}, label:"Cut permitting red tape", eff:"+Planning health \u00b7 +business & homeowners"},
  climate:{dept:"dwp", seg:{progressives:2,overall:1}, label:"Climate / DWP resilience", eff:"+DWP health \u00b7 +progressives"},
};
function govDirective(kind){ const m=GOV_DIRECTIVES[kind]; if(!m) return render(); if(!govSpendAP(1)) return render(); const gov=G.gov;
  const gain=Math.max(1, Math.round(6*(1-gov.deptHealth[m.dept]/100)+2));
  gov.deptHealth[m.dept]=clamp(gov.deptHealth[m.dept]+gain);
  bumpApproval(m.seg);
  gov.lastDirective={ turn:gov.turn, label:m.label, dept:govDept(m.dept).name, gain };
  govLog("Executive Directive: "+m.label+" (+"+gain+" "+govDept(m.dept).name+" health).");
  render(); }
function govViewMeasures(){
  const gov=G.gov;
  const onBallot=gov.measures.filter(m=>m.result===null).map(m=>{ const meas=GOV_MEASURES.find(x=>x.id===m.id);
    return `<div class="panel" style="margin:6px 0"><b>${escapeHtml(meas.title)}</b> <span class="small">· Nov ${m.electionYear} ballot</span>
      <p class="small">${escapeHtml(meas.note)}</p>${govBar("Projected yes",m.support,govColor(m.support))}
      <button class="btn small" onclick="govCampaignMeasure('${m.id}')">Campaign for it (−1AP,−6cap)</button></div>`; }).join("");
  const decided=gov.measures.filter(m=>m.result).map(m=>{ const meas=GOV_MEASURES.find(x=>x.id===m.id); return `<div class="small">${m.result==="passed"?'✔ PASSED':'✗ FAILED'} — ${escapeHtml(meas.title)} (Nov ${m.electionYear})</div>`; }).join("");
  const refMenu=GOV_MEASURES.filter(me=>!gov.measures.find(m=>m.id===me.id&&m.result===null)).map(me=>`<button class="btn small" style="display:block;width:100%;text-align:left;margin:4px 0" onclick="govReferMeasure('${me.id}')">+ Refer: ${escapeHtml(me.title)}</button>`).join("");
  return `<div class="grid cols-2" style="gap:12px">
    <div><h3>On the ballot</h3>${onBallot||'<p class="small">Nothing referred yet.</p>'}${decided?`<div class="panel" style="margin-top:8px"><h3>Decided</h3>${decided}</div>`:''}</div>
    <div class="panel"><h3>Refer a measure (−1 AP)</h3><p class="small">The Council can place charter amendments, bonds, and taxes on the next even-year November ballot. Voters decide.</p>${refMenu}</div></div>`;
}

function govViewRecord(){
  const gov=G.gov;
  const items=gov.log.length?gov.log.slice(0,70).map(e=>`<div class="small" style="padding:3px 0;border-bottom:1px solid var(--line)"><span style="color:var(--muted)">${e.d}</span> — ${escapeHtml(e.msg)}</div>`).join(""):'<span class="small">Nothing yet.</span>';
  return `<div class="panel"><h3>Official record</h3>${items}</div>`;
}

function renderGovEventModal(){
  const ev=G.gov.pendingGovEvent; if(!ev) return;
  govClearModals();
  const wrap=document.createElement("div"); wrap.className="modal-back";
  wrap.innerHTML=`<div class="modal"><h2>${escapeHtml(ev.title)}</h2><p>${escapeHtml(ev.body)}</p>
    <div style="margin-top:12px">${ev.choices.map((c,i)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:6px 0" onclick="govResolveEvent(${i})">${escapeHtml(c.label)}</button>`).join("")}</div></div>`;
  document.body.appendChild(wrap);
}

function renderGovEnd(){
  const gov=G.gov; const r=gov.reelectionResult||{won:false,score:0,ap:0,warBonus:0,deptBonus:0,scandalPen:0};
  app.innerHTML=`<div class="topbar"><div class="brand">LA SIM — END OF TERM</div></div>
    <div class="panel" style="padding:26px;text-align:center">
      <h1>${r.won?"Re-elected. 🏆":"Voted out. 🗳"}</h1><p>${escapeHtml(govPlayerTitle())}</p>
      <p class="small">Legacy score <b>${r.score}</b> — approval ${r.ap}%, war-chest +${r.warBonus}, departments +${r.deptBonus}, scandal −${r.scandalPen}.</p>
      <p class="small">Laws enacted <b>${gov.legacy.lawsPassed}</b> · Crises handled <b>${gov.legacy.crisesHandled}</b> · Confirmations <b>${gov.legacy.confirmations}</b> · Ballot measures passed <b>${gov.legacy.measuresPassed}</b> · Budgets <b>${gov.budgetsAdopted}</b> · Scandals survived <b>${gov.legacy.scandalsSurvived}</b></p>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" onclick="startGoverning()">Run it back</button> <button class="btn ghost" onclick="govExitToTitle()">Title</button></div></div>`;
}

// Global uncaught-error handler — last-ditch surface for silent failures
if (typeof window !== "undefined") {
  window.addEventListener("error", function(e) {
    try { showErrorBanner("Uncaught error: " + (e.message || e.error || "unknown")); } catch (_) {}
  });
  window.addEventListener("unhandledrejection", function(e) {
    try { showErrorBanner("Unhandled promise rejection: " + (e.reason && e.reason.message || e.reason || "unknown")); } catch (_) {}
  });
}

// Boot
try {
  if (load()) render();
  else renderTitle();
} catch (err) {
  const root = document.body;
  root.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.style.cssText = "padding:20px;background:#5a1a1a;color:#fff;font-family:sans-serif";
  const msg = document.createElement("div");
  msg.textContent = "Boot error: " + (err.message || err);
  const btn = document.createElement("button");
  btn.textContent = "Clear save & reload";
  btn.style.cssText = "padding:8px 14px;background:#ffb000;color:#000;border:none;border-radius:4px;cursor:pointer;margin-top:16px";
  btn.addEventListener("click", () => { try { localStorage.removeItem("lasim_save_v1"); } catch (_) {} location.reload(); });
  wrap.appendChild(msg);
  wrap.appendChild(btn);
  root.appendChild(wrap);
}
</script>
</body>
</html>
